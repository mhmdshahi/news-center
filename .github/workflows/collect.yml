name: collect
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs; the analyst also triggers this
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Collect RSS
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collector/collect.py
      - name: Commit library
        run: |
          scripts/commit_push.sh "collect $(date -u +%H:%M)Z" data/inbox.jsonl data/seen.json data/sources_status.json data/dropped.jsonl
