name: send
on:
  push:
    branches: [main]
    paths: ["data/outbox.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: send
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sender/send.py
      - name: Record sent ids
        run: scripts/commit_push.sh "send: $(date -u +%H:%M)Z" data/sent.json
