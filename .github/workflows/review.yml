name: review-6h
on:
  schedule:
    - cron: "3 */6 * * *"   # every 6 hours (00:03, 06:03, 12:03, 18:03 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print, do not send to Telegram"
        type: boolean
        default: false
      hours:
        description: "Look-back window in hours"
        default: "6"
permissions:
  contents: read
concurrency:
  group: review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 6-hour signal review → Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/review.py --hours "${{ inputs.hours || '6' }}" ${{ inputs.dry_run && '--dry-run' || '' }}
